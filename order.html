<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | SPEED FOOD</title>

<link rel="stylesheet" href="stayle.css/order.css">
</head>

<body>

<header>

   
    <div class="top-bar">
    <div class="logo">
            <img src="../1.png" alt="" width="100px">
             <span>SPEED FOOD</span>
        </div>
    <nav>
          <a href="cart.html">السلة</a>
        <a href="menu.html"> القائمة</a>
        <a href="offers.html"> العروض</a>
     
    </nav>
</div>
</header>

<div class="container">

    <h1> إتمام الطلب</h1>

    <p class="subtitle">
        يرجى إدخال معلوماتك لإرسال طلبك
    </p>

    <form onsubmit="sendOrder(event)">

        <div class="form-group">
            <label>👤 الاسم الكامل</label>
            <input type="text" placeholder="أدخل اسمك الكامل" required>
        </div>

        <div class="form-group">
            <label>📞 رقم الهاتف</label>
            <input type="tel" placeholder="05XXXXXXXX" required>
        </div>

        <div class="form-group">
            <label>📧 البريد الإلكتروني</label>
            <input type="email" placeholder="example@gmail.com">
        </div>

        <div class="form-group">
            <label>📍 العنوان</label>
            <input type="text" placeholder="أدخل عنوانك بالتفصيل" required>
        </div>

        <div class="form-group">
            <label>💳 طريقة الدفع</label>
            <select required>
                <option value="">اختر طريقة الدفع</option>
                <option>الدفع عند الاستلام</option>
                <option>بطاقة بنكية</option>
            </select>
        </div>

        <div class="form-group">
            <label>📝 ملاحظات إضافية</label>
            <textarea placeholder="أي ملاحظات خاصة بطلبك..."></textarea>
        </div>

        <button class="submit-btn" type="submit">
            ✅ تأكيد الطلب
        </button>

    </form>

    <p class="note">
        شكراً لاختيارك SPEED FOOD ❤️
    </p>

</div>



<script src="script.js/order.js"></script>
</body>
</html>
